<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!-- Bouquet de roses bleu poudre et blanches, feuillage d'eucalyptus -->
  <defs>
    <radialGradient id="bleu" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#e8eef6"/>
      <stop offset="55%" stop-color="#a8bcd0"/>
      <stop offset="100%" stop-color="#6f8399"/>
    </radialGradient>
    <radialGradient id="blanc" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#eef0ea"/>
      <stop offset="100%" stop-color="#b9c3b5"/>
    </radialGradient>
    <linearGradient id="feuille" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8fa085"/>
      <stop offset="100%" stop-color="#4e5c48"/>
    </linearGradient>

    <!-- Une rose : cœur en spirale + pétales enveloppants -->
    <symbol id="rose" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="46" fill="var(--petale, url(#bleu))"/>
      <path d="M50 12 A38 38 0 0 1 88 50 A38 38 0 0 1 50 88" fill="none"
            stroke="rgba(78,96,114,.28)" stroke-width="2.4"/>
      <path d="M50 24 A26 26 0 0 1 76 50 A26 26 0 0 1 50 76 A26 26 0 0 1 24 50"
            fill="none" stroke="rgba(78,96,114,.34)" stroke-width="2.2"/>
      <path d="M50 36 A14 14 0 0 1 64 50 A14 14 0 0 1 50 64 A14 14 0 0 1 36 50 A14 14 0 0 1 50 36"
            fill="none" stroke="rgba(78,96,114,.4)" stroke-width="2"/>
      <path d="M50 44 a6 6 0 1 1 6 6" fill="none" stroke="rgba(78,96,114,.5)" stroke-width="2"/>
    </symbol>

    <symbol id="bouton" viewBox="0 0 40 60">
      <path d="M20 4c9 6 12 16 12 26 0 12-5 22-12 26-7-4-12-14-12-26C8 20 11 10 20 4z"
            fill="var(--petale, url(#bleu))"/>
      <path d="M20 6v46" fill="none" stroke="rgba(78,96,114,.3)" stroke-width="1.8"/>
      <path d="M20 56 v-6" fill="none" stroke="url(#feuille)" stroke-width="3" stroke-linecap="round"/>
    </symbol>
  </defs>

  <g fill="url(#feuille)" opacity=".95">
    <path d="M116 96c26-16 52-14 74 4-24 12-52 12-74-4z"/>
    <path d="M96 132c-6-28 4-52 26-66 4 26-6 52-26 66z"/>
    <path d="M150 150c24-4 44 6 56 26-24 4-46-6-56-26z"/>
    <path d="M60 78c-22-10-34-28-34-52 20 10 32 30 34 52z"/>
  </g>

  <g stroke="url(#feuille)" stroke-width="3" stroke-linecap="round" fill="none" opacity=".9">
    <path d="M120 104c-24 6-44 24-54 48"/>
    <path d="M140 112c18 10 30 26 34 46"/>
  </g>

  <use href="#rose" x="82"  y="34"  width="88" height="88"/>
  <use href="#rose" x="146" y="82"  width="70" height="70" style="--petale:url(#blanc)"/>
  <use href="#rose" x="42"  y="96"  width="62" height="62" style="--petale:url(#blanc)"/>
  <use href="#rose" x="104" y="140" width="54" height="54"/>
  <use href="#bouton" x="26" y="42"  width="30" height="45"/>
  <use href="#bouton" x="176" y="34" width="26" height="39" style="--petale:url(#blanc)"/>
  <use href="#bouton" x="166" y="152" width="24" height="36"/>
</svg>
